[package]
name = "sanity"
version = "0.3.9"
edition = "2024"

[dependencies]
sanity-macros = { path = "../sanity-macros" }

clap = { version = "4.6.7", features = ["derive"] }
color-eyre = { version = "0.6.5", default-features = false }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "tokio"] }
minijinja = { version = "3.1.0", features = ["serde"] }
notify-debouncer-full = "0.7.0"
tokio = { version = "1.54.1", features = ["full"] }
env_logger = "0.11.11"
log = { version = "0.4.35", features = ["std"] }
serde = { version = "1.0.229", features = ["alloc"] }
serde_json = { version = "1.0.154", features = ["alloc"] }
chrono = "0.4.45"
dunce = "1.0.5"
rayon = "1.12.0"

minify-html-onepass = "0.18.1"

# make sure to sync the version of these with the one demanded by `minify-html-onepass`, in order to shrink the dependency count by a bit.
oxc_minifier = "0.95.0"
oxc_parser = "0.95.0"
oxc_allocator = "0.95.0"
oxc_span = "0.95.0"
oxc_codegen = "0.95.0"

[dependencies.grass]
version = "0.13.4"
default-features = false

[dependencies.mlua]
version = "0.12.2"
features = ["luajit", "serialize", "send", "error-send", "vendored"]
